<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>8 Haftalık Upper / Lower Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181a;--muted:#6b7078;--line:#e3e5e8;--accent:#111;--ok:#16834b;--warn:#a35a00}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:auto;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}
nav{display:flex;gap:7px;overflow:auto;padding-top:12px}.tab{white-space:nowrap}.tab.active{background:#111;color:#fff;border-color:#111}
main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.metric{font-size:24px;font-weight:750}.label{font-size:12px;color:var(--muted)}
.section{margin-top:16px}.section h2{font-size:16px;margin:0 0 10px}
.workout{margin-bottom:14px}.workout h3{font-size:16px;margin:0 0 9px}.badge{font-size:11px;background:#eef0f2;padding:4px 7px;border-radius:999px;color:#555}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-size:11px;text-transform:uppercase}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}input[type=number]{min-width:68px}
.row{display:grid;grid-template-columns:1.5fr .65fr .65fr .8fr .8fr .9fr;gap:6px;align-items:center}.row.header{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.exercise{padding:9px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tiny{font-size:12px;color:var(--muted)}
textarea{min-height:100px;resize:vertical}.hidden{display:none}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none}
@media(max-width:760px){body{font-size:15px}.grid,.checkin{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 65px 65px 75px 75px}.row .rir{display:none}th:nth-child(5),td:nth-child(5){display:none}}
.today-btn{display:none}
@media(max-width:760px){.today-btn{display:block;width:100%;margin:10px 0 0;padding:14px;font-size:16px}.top .actions button:first-child{display:none}.row{grid-template-columns:1fr 70px 70px}.row>div:nth-child(4),.row>div:nth-child(5),.row>div:nth-child(6){display:none}.exercise{padding:12px 0}.exercise input{min-height:42px;font-size:16px}.card{padding:13px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div><h1>8 Hafta — Upper / Lower</h1><div class="sub">Hızlı kayıt • otomatik ilerleme • haftalık agent görüşmesi</div></div>
<div class="actions"><button onclick="exportData()">JSON yedek</button><button class="primary" onclick="copyAgentReport()">Agent raporunu kopyala</button></div></div>
<button class="today-btn primary" onclick="render('log')">🏋️ Bugünkü Antrenman</button><nav id="tabs"></nav>
</div></header>

<main>
<section id="dashboard"></section>
<section id="program" class="hidden"></section>
<section id="log" class="hidden"></section>
<section id="checkins" class="hidden"></section>
<section id="settings" class="hidden"></section>
</main>
<div id="toast" class="toast"></div>

<script>
const KEY="ul8_tracker_v1";
const defaultProgram=[
 {name:"Gün 1 — Upper / Güç", exercises:[
  ["Bench Press",4,5],["Overhead Press",4,6],["Pull-up",4,8],["Barbell Row",4,8],["Lateral Raise",4,15]
 ]},
 {name:"Gün 2 — Lower / Güç", exercises:[
  ["Squat",4,5],["Romanian Deadlift",4,8],["Leg Press",3,10],["Leg Curl",3,10],["Calf Raise",4,12]
 ]},
 {name:"Gün 3 — Upper / Hipertrofi", exercises:[
  ["Incline Dumbbell Press",3,10],["Chest-Supported Row",4,10],["Lat Pulldown",4,10],["Cable Lateral Raise",4,15],["Dumbbell Curl",3,12],["Triceps Pushdown",3,12]
 ]},
 {name:"Gün 4 — Lower / Hipertrofi", exercises:[
  ["Trap Bar Deadlift / Deadlift",3,5],["Reverse Lunge",3,10],["Leg Extension",3,12],["Leg Curl",3,12],["Hanging Leg Raise",3,15],["Plank",3,1]
 ]}
];
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{program:defaultProgram,logs:{},checkins:{},week:1};
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast("Kaydedildi ✓")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1400)}
function allExercises(){return state.program.flatMap((d,di)=>d.exercises.map((e,ei)=>({di,ei,name:e[0],sets:e[1],reps:e[2]})))}
function logKey(w,di,ei){return `${w}-${di}-${ei}`}
function getLog(w,di,ei){return state.logs[logKey(w,di,ei)]||{weight:"",reps:"",sets:"",rir:"",note:""}}
function setLog(w,di,ei,k,v){let l=getLog(w,di,ei);l[k]=v;state.logs[logKey(w,di,ei)]=l;save()}
function nav(){
 const items=[["dashboard","Özet"],["program","Program"],["log","Antrenman Kaydı"],["checkins","Haftalık Görüşme"],["settings","Ayarlar"]];
 document.getElementById("tabs").innerHTML=items.map(x=>`<button class="tab ${x[0]=="dashboard"?"active":""}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join("");
}
function show(id,el){
 document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el?.classList.add("active");
 render(id);
}
function render(id){
 if(id==="dashboard")dashboard(); if(id==="program")program(); if(id==="log")log(); if(id==="checkins")checkins(); if(id==="settings")settings();
}
function dashboard(){
 let completed=0,total=0;
 allExercises().forEach(x=>{let l=getLog(state.week,x.di,x.ei);total++;if(l.weight||l.reps||l.note)completed++});
 let ci=state.checkins[state.week]||{};
 document.getElementById("dashboard").innerHTML=`
 <div class="grid">
  <div class="card"><div class="label">Aktif hafta</div><div class="metric">${state.week}/8</div></div>
  <div class="card"><div class="label">Hareket kaydı</div><div class="metric">${completed}/${total}</div></div>
  <div class="card"><div class="label">Kilo</div><div class="metric">${ci.weight||"—"} <small>kg</small></div></div>
  <div class="card"><div class="label">Bel</div><div class="metric">${ci.waist||"—"} <small>cm</small></div></div>
 </div>
 <div class="section card"><h2>Bu hafta</h2>
 <div class="tiny">Haftayı seçmek için üstteki kontrolü kullan. Her hareket için kilo + gerçek tekrarları gir. RIR varsa özellikle yaz; ilerleme kararını kolaylaştırır.</div>
 <div class="actions"><select id="weekSelect" onchange="changeWeek(this.value)">${[1,2,3,4,5,6,7,8].map(w=>`<option ${w==state.week?"selected":""}>${w}</option>`).join("")}</select>
 <button class="primary" onclick="show('log',document.querySelectorAll('.tab')[2])">Bugünkü kaydı aç</button>
 <button onclick="copyAgentReport()">Bu haftayı agent'a gönder</button></div></div>
 <div class="section card"><h2>Koç notu</h2><p class="tiny">Hedef: yağ kaybederken kası korumak/geliştirmek. Ana hareketlerde performans, yardımcı hareketlerde tekrar/teknik ve RIR takip ediliyor. Ağrı varsa not alanına yaz ve hareketi zorlamama kuralını kullan.</p></div>`;
}
function changeWeek(v){state.week=+v;save();render("dashboard")}
function program(){
 document.getElementById("program").innerHTML=`<div class="card"><h2>Program</h2><p class="tiny">Bu başlangıç programı düzenlenebilir. Set/tekrar hedefleri burada tutulur; gerçekleşen değerleri Antrenman Kaydı'ndan gir.</p>
 ${state.program.map((d,di)=>`<div class="workout section"><h3>${d.name}</h3><table><thead><tr><th>Hareket</th><th>Set</th><th>Tekrar</th></tr></thead><tbody>${d.exercises.map((e,ei)=>`<tr><td><input value="${esc(e[0])}" onchange="editProg(${di},${ei},0,this.value)"></td><td><input type="number" value="${e[1]}" onchange="editProg(${di},${ei},1,this.value)"></td><td><input type="number" value="${e[2]}" onchange="editProg(${di},${ei},2,this.value)"></td></tr>`).join("")}</tbody></table></div>`).join("")}</div>`;
}
function editProg(di,ei,k,v){state.program[di].exercises[ei][k]=k?+v:v;save()}
function log(){
 document.getElementById("log").innerHTML=`<div class="card"><div class="top"><div><h2 style="margin:0">Hafta ${state.week} kayıtları</h2><div class="tiny">Hedef set/tekrar → gerçekleşen kilo/tekrar. “RIR” = sette kaç tekrar daha çıkarabilirdin.</div></div><select onchange="changeWeekLog(this.value)">${[1,2,3,4,5,6,7,8].map(w=>`<option ${w==state.week?"selected":""}>${w}</option>`).join("")}</select></div>
 ${state.program.map((d,di)=>`<div class="workout section"><h3>${d.name}</h3><div class="row header"><div>Hareket</div><div>Hedef</div><div>Kilo</div><div>Gerçek tekrar</div><div>RIR</div><div>Not</div></div>
 ${d.exercises.map((e,ei)=>{let l=getLog(state.week,di,ei);return `<div class="exercise"><div class="row"><div><b>${esc(e[0])}</b><div class="tiny">${e[1]}×${e[2]} hedef</div></div>
 <div class="tiny">${e[1]}×${e[2]}</div><div><input type="number" step="0.5" value="${l.weight}" placeholder="kg" onchange="setLog(${state.week},${di},${ei},'weight',this.value)"></div>
 <div><input type="text" value="${esc(l.reps)}" placeholder="5,5,5,5" onchange="setLog(${state.week},${di},${ei},'reps',this.value)"></div>
 <div class="rir"><input type="number" min="0" max="5" value="${l.rir}" placeholder="1-2" onchange="setLog(${state.week},${di},${ei},'rir',this.value)"></div>
 <div><input value="${esc(l.note)}" placeholder="kolay / zor / ağrı..." onchange="setLog(${state.week},${di},${ei},'note',this.value)"></div></div></div>`}).join("")}</div>`).join("")}
 <div class="actions"><button class="primary" onclick="copyAgentReport()">Hafta ${state.week} raporunu kopyala</button><button onclick="nextWeek()">Sonraki haftaya geç →</button></div></div>`;
}
function changeWeekLog(v){state.week=+v;save();log()}
function nextWeek(){if(state.week<8){state.week++;save();log()}else toast("8. hafta tamamlandı")}
function checkins(){
 document.getElementById("checkins").innerHTML=`<div class="card"><h2>Haftalık ilerleme görüşmesi</h2><p class="tiny">Pazar günü 2 dakikada doldur. Bunlar agent'ın karar vermesi için özet veridir.</p>
 <select onchange="changeCIWeek(this.value)" id="ciweek">${[1,2,3,4,5,6,7,8].map(w=>`<option ${w==state.week?"selected":""}>${w}</option>`).join("")}</select>
 <div class="checkin section">${ciInput("Kilo (kg)","weight")}${ciInput("Bel (cm)","waist")}${ciInput("Uyku / enerji (1-10)","energy")}</div>
 <div class="section"><label class="tiny">Bu hafta en iyi giden şey</label><textarea id="good"></textarea></div>
 <div class="section"><label class="tiny">En çok zorlayan şey / açlık / kaçamak / ağrı</label><textarea id="bad"></textarea></div>
 <div class="section"><label class="tiny">Koçtan bu hafta istediğim karar</label><textarea id="ask"></textarea></div>
 <div class="actions"><button class="primary" onclick="saveCI()">Check-in kaydet</button><button onclick="copyAgentReport()">Agent görüşmesi metnini kopyala</button></div></div>`;
 loadCI();
}
function ciInput(label,key){return `<div><label class="tiny">${label}</label><input id="ci_${key}" type="number" step="0.1"></div>`}
function changeCIWeek(v){state.week=+v;save();checkins()}
function loadCI(){let c=state.checkins[state.week]||{};["weight","waist","energy","good","bad","ask"].forEach(k=>{let e=document.getElementById(k==="good"?"good":k==="bad"?"bad":k==="ask"?"ask":"ci_"+k);if(e)e.value=c[k]||""})}
function saveCI(){state.checkins[state.week]={weight:val("ci_weight"),waist:val("ci_waist"),energy:val("ci_energy"),good:val("good"),bad:val("bad"),ask:val("ask")};save()}
function val(id){return document.getElementById(id)?.value||""}
function settings(){
 document.getElementById("settings").innerHTML=`<div class="card"><h2>Ayarlar / veri</h2><p class="tiny">Veriler yalnızca bu tarayıcıda localStorage'da tutulur. Cihaz değiştirirsen JSON yedeğini alıp içe aktar.</p>
 <div class="actions"><button onclick="exportData()">JSON dışa aktar</button><label class="btn">JSON içe aktar <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label><button onclick="resetAll()">Tüm veriyi sıfırla</button></div></div>`;
}
function report(){
 let w=state.week, c=state.checkins[w]||{};
 let lines=[`8 HAFTALIK UPPER/LOWER — HAFTA ${w}/8`,`Vücut: kilo=${c.weight||"?"} kg, bel=${c.waist||"?"} cm, enerji/uyku=${c.energy||"?"}/10`,`İyi giden: ${c.good||"-"}`,`Zorlayan: ${c.bad||"-"}`,`Koçtan istediğim karar: ${c.ask||"-"}`,``,`ANTRENMAN KAYITLARI:`];
 state.program.forEach((d,di)=>{lines.push(`\n${d.name}`);d.exercises.forEach((e,ei)=>{let l=getLog(w,di,ei);lines.push(`- ${e[0]} | hedef ${e[1]}x${e[2]} | kilo ${l.weight||"?"} kg | gerçekleşen tekrar ${l.reps||"?"} | RIR ${l.rir||"?"} | not: ${l.note||"-"}`)})});
 lines.push(`\nAGENT GÖREVİ: Bu haftayı önceki haftalarla karşılaştır. Performans trendini, hacmi, RIR'ı, kilo/bel değişimini ve ağrı/uyum notlarını değerlendir. Sonraki hafta için yalnızca gerekli değişiklikleri öner; gereksiz program değişikliği yapma. Yağ kaybı + kas korunması/gelişmesi hedefini gözet.`);
 return lines.join("\n");
}
function copyAgentReport(){navigator.clipboard.writeText(report()).then(()=>toast("Agent raporu panoya kopyalandı ✓")).catch(()=>prompt("Kopyalanacak rapor:",report()))}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="upper-lower-8-week-backup.json";a.click()}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();location.reload()}catch(e){alert("Geçersiz JSON")}};r.readAsText(file)}
function resetAll(){if(confirm("Tüm program ve kayıtlar silinsin mi?")){localStorage.removeItem(KEY);location.reload()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
nav();render("dashboard");
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
